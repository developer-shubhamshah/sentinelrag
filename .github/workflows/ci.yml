name: CI

# Runs on every pull request. Each job is an independent required check.
on:
  pull_request:
    branches: [master]

# Least privilege by default; the OSV job widens its own permissions below.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    # Postgres + pgvector so the router/regression tests can import src/db.ts
    # (which opens a pool on import). No embedding/LLM keys are needed — the
    # regression gate uses only route() + pure metric math, not generation.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate # apply sql/001 + 002 (also validates the migrations)
      - run: npm test # vitest run

  audit:
    name: npm audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Non-zero exit (fails the job) only for high or critical advisories.
      - run: npm audit --audit-level=high

  # OSV-Scanner reusable PR workflow (verified against
  # https://google.github.io/osv-scanner/github-action/). It diffs the PR
  # against the base branch and, with fail-on-vuln, fails on any newly
  # introduced known vulnerability — a strict superset of high/critical.
  osv-scan:
    name: OSV-Scanner
    permissions:
      actions: read
      security-events: write # upload SARIF to the Security tab
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.1
    with:
      fail-on-vuln: true
